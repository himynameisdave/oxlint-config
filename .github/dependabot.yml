# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Action pins go stale silently — nothing in CI fails when they fall behind,
  # so they only get noticed by someone reading the YAML. Let dependabot do it.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # oxlint bumps often register new rules, which fail check-coverage until
      # decided. Kept apart from oxfmt so a formatter bump can merge on its own.
      oxlint:
        patterns:
          - 'oxlint'
          - 'oxlint-tsgolint'
      oxfmt:
        patterns:
          - 'oxfmt'
          - '@himynameisdave/oxfmt-config'
    ignore:
      # Pinned to the engines.node floor (22.18) so the build rejects newer Node APIs.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

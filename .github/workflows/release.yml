name: Release

# Manually-triggered npm release: pick a bump size, and this workflow runs the
# gates, versions, tags, publishes (npm trusted publishing / OIDC — no token
# secret, no OTP), pushes, and creates the GitHub release. See PUBLISHING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump (patch = docs/tooling only, minor = any rule churn, major = structural — see PUBLISHING.md)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Never let two releases interleave; queue rather than cancel a publish in flight.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit + tag, create the GitHub release
  id-token: write # mint the OIDC token npm trusted publishing exchanges for publish rights

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release from a non-main ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must run from main (got '${{ github.ref }}')" >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm does the publish (trusted publishing needs npm >= 11.5.1; Node 24 bundles it).
      # registry-url writes the .npmrc that points publish at the public registry.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all gates (lint, format, rule coverage, consumer smoke)
        run: bun run test

      - name: Bump version, commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.version }}" -m "🔖 Release v%s"

      # prepublishOnly builds dist/; provenance is attached automatically by
      # trusted publishing. Publish before pushing so a failed publish leaves
      # nothing on the remote to clean up.
      - name: Publish to npm
        run: npm publish

      - name: Push version commit and tag
        run: git push --follow-tags origin main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(jq -r .version package.json)" --generate-notes

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (builds first — self-lints with own config, type-aware on)
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Rule coverage (every registered oxlint rule has a decision)
        run: bun run check-coverage
